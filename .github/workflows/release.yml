name: Release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to build release binaries
# and publish them as a GitHub release. Running the workflow by hand only builds the artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to a commit, with its version in the comment; Dependabot updates both.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: oxidrop-windows-x86_64.zip
          - os: ubuntu-latest
            archive: oxidrop-linux-x86_64.tar.gz
          - os: macos-latest
            archive: oxidrop-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev
      # What Cargo's `trim-paths` will do once it's stable: source paths in the binary (panic
      # locations) become relative to the checkout, Cargo's home, and the Rust toolchain, so
      # they don't name the build machine's folders.
      - name: Leave the build machine's paths out of the binary
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if [ "$RUNNER_OS" = Windows ]; then cargo_home="$(cygpath -w "$cargo_home")"; fi
          flags="--remap-path-scope=object --remap-path-prefix=$GITHUB_WORKSPACE="
          flags="$flags --remap-path-prefix=$cargo_home= --remap-path-prefix=$(rustc --print sysroot)="
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-about
      - run: cargo build --release --locked
      - name: Write the third-party licenses (see about.toml)
        run: cargo about generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.txt
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/oxidrop.exe, README.md, LICENSE, THIRD-PARTY-LICENSES.txt, assets/fonts/Inter-LICENSE.txt -DestinationPath ${{ matrix.archive }}
      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/release oxidrop -C "$GITHUB_WORKSPACE" README.md LICENSE THIRD-PARTY-LICENSES.txt -C assets/fonts Inter-LICENSE.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
