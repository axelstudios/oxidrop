# cargo-about: the licenses of the crates built into Oxidrop, which the release workflow writes to
# THIRD-PARTY-LICENSES.txt in each archive with `cargo about generate about.hbs`.

# Where a crate offers a choice of licenses, the first one here that it allows is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# The release builds.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
# Only crates built into the app: not the build scripts' or tests' dependencies, or Oxidrop itself.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# Clarifications, for crates whose license files cargo-about doesn't find or recognize on its own;
# it would use the license's standard text instead, without the copyright notice. Each names the
# real files, in the published crate (`files`) or in its repository at the commit it was
# published from (`git`), with their SHA-256. An entry whose files no longer match is skipped,
# with a warning, so a crate that changes its license gets looked at again.
#
# Still on the standard text, all macOS only: `dispatch`, and the objc2 crates. objc2's newer
# releases have no license text (only a LICENSE.md about their licensing), and cargo-about can't
# tell its older releases, which have one, from the newer ones.

# libdeflate-sys builds libdeflate's C code into the app, which has its own (MIT) license.
[libdeflate-sys.clarify]
license = "Apache-2.0 AND MIT"

[[libdeflate-sys.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "a60eea817514531668d7e00765731449fe14d059d3249e0bc93b36de45f759f2"

[[libdeflate-sys.clarify.files]]
path = "libdeflate/COPYING"
license = "MIT"
checksum = "4ad69099cb4374836fd27583d9991e2838cd86b6e4666ab26b2d32582c91e73a"

