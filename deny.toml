# cargo-deny, which CI runs as `cargo deny check`: Cargo.lock against the RustSec advisory
# database, crate licenses against the list below, duplicate crates, and where crates come from.

[graph]
# The release builds.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
# Vulnerable, unmaintained, and unsound crates fail the check (the defaults). An advisory that
# can't be acted on goes in `ignore`, with the reason; cargo-deny warns once it no longer applies.
ignore = [
    # Unmaintained, with no maintained release to move to yet, and only in the Linux build
    # through winit and AccessKit. They go away when egui moves to newer versions of those.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, for winit's Wayland title bars" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, for AccessKit's screen reader support (zbus 5)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, for AccessKit's screen reader support (zbus 5)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, for AccessKit's screen reader support (zbus 5)" },
]

[licenses]
# Every crate's license expression has to be satisfiable with these. The same list is in
# about.toml, which writes the notices for them.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# egui, winit, and wgpu bring in about 20 crates in two versions, which only they can fix, so
# duplicates aren't reported.
multiple-versions = "allow"

[sources]
# Only crates.io (the vendored zopfli is a path dependency, which is always allowed).
unknown-registry = "deny"
unknown-git = "deny"
